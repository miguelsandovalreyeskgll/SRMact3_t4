spring.application.name=SRMact3_t4
server.port=${PORT:8083}

# MySQL: la contrasena se recibe por una variable de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/srmact3_db}
spring.datasource.username=${DB_USER:srmact3}
spring.datasource.password=${DB_PASSWORD}

# JPA crea/actualiza las tablas, pero la base de datos debe existir
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
